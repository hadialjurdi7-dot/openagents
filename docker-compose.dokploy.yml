# Dokploy self-host of the OpenAgents Workspace (built from source).
# Single public hostname: nginx serves the Next.js frontend on / and proxies /v1 to the API.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openagents
      POSTGRES_USER: openagents
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagents -d openagents"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./workspace/backend
      dockerfile: backend.Dockerfile
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head"]
    environment:
      DATABASE_URL: postgresql://openagents:${DB_PASSWORD}@db:5432/openagents
      PYTHONPATH: /app
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./workspace/backend
      dockerfile: backend.Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://openagents:${DB_PASSWORD}@db:5432/openagents
      AUTH_MODE: workspace_token
      IDENTITY_MODE: standalone
      CORS_ORIGINS: ${PUBLIC_URL}
      WORKSPACE_SESSION_SECRET: ${SESSION_SECRET}
      FILE_STORAGE_PATH: /data/files
      WEB_CONCURRENCY: "2"
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./workspace/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
        NEXT_PUBLIC_FIRST_PARTY_HOSTNAMES: ${HOSTNAME_ONLY}
        NEXT_PUBLIC_INLINE_LOGIN: "true"
    restart: unless-stopped
    depends_on:
      - backend

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./deploy/dokploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=one-person-company-hermes-qqn0ad"
      - "traefik.http.routers.openagents.rule=Host(`${HOSTNAME_ONLY}`)"
      - "traefik.http.routers.openagents.entrypoints=web,websecure"
      - "traefik.http.routers.openagents.tls=true"
      - "traefik.http.routers.openagents.tls.certresolver=letsencrypt"
      - "traefik.http.services.openagents.loadbalancer.server.port=80"

volumes:
  pgdata:
  files:

networks:
  traefik:
    external: true
    name: one-person-company-hermes-qqn0ad
